<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>音乐 | Galois37の完美算术教室</title>
  <meta name="description" content="Galois37 的音乐播放器和歌单。">
  <link rel="stylesheet" href="styles.css?v=20260630-article-hub-1">
</head>
<body data-page="music">
  <header class="site-header" id="top">
    <a class="brand" href="index.html" aria-label="回到首页">
      <span class="brand-mark"><img src="assets/avatar.jpg" alt=""></span>
      <span>Galois37の完美算术教室</span>
    </a>
    <button class="nav-toggle" type="button" aria-label="打开导航" aria-expanded="false" aria-controls="site-nav">
      <span></span><span></span><span></span>
    </button>
    <nav class="site-nav" id="site-nav" aria-label="主导航">
      <a href="index.html" data-nav="home">首页</a>
      <a href="about.html" data-nav="about">关于</a>
      <a href="notes.html" data-nav="notes">笔记</a>
      <a href="articles.html" data-nav="articles">项目</a>
      <a href="ask.html" data-nav="ask">提问箱</a>
      <a class="nav-extra" href="archive.html" data-nav="archive">归档</a>
      <a class="nav-extra" href="moments.html" data-nav="moments">说说</a>
      <a class="nav-extra" href="music.html" data-nav="music">音乐</a>
      <a class="nav-extra" href="friends.html" data-nav="friends">友链</a>
    </nav>
    <button class="theme-toggle" type="button" data-theme-toggle aria-label="切换白天模式和黑夜模式" title="切换主题">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v2M12 19v2M5.64 5.64l1.42 1.42M16.95 16.95l1.41 1.41M3 12h2M19 12h2M5.64 18.36l1.42-1.42M16.95 7.05l1.41-1.41"/><circle cx="12" cy="12" r="4"/></svg>
    </button>
  </header>

  <main class="page-main music-page">
    <section class="page-hero">
      <p class="eyebrow">Music</p>
      <h1>音乐</h1>
      <p data-setting-text="pages.musicDescription">在这里播放和切换站点歌单。</p>
    </section>

    <section class="section music-room">
      <aside class="music-placeholder music-player music-player-large" data-music-player aria-label="音乐播放器">
        <div class="music-disc" aria-hidden="true"><img src="assets/music/yoru-no-himawari-cover.jpg" alt="" data-music-cover></div>
        <div class="music-meta">
          <p class="eyebrow">Now Playing</p>
          <h2 data-music-title>夜の向日葵</h2>
          <p data-music-artist>松本文紀</p>
          <p class="music-lyric" data-music-lyric>纯音乐 无歌词</p>
        </div>
        <div class="music-progress-row" aria-label="播放进度">
          <span data-music-current>00:00</span>
          <input type="range" min="0" max="100" value="0" data-music-progress aria-label="拖动调整播放进度">
          <span data-music-duration>00:00</span>
        </div>
        <div class="music-controls" aria-label="音乐控制">
          <button type="button" data-music-prev aria-label="上一首">‹</button>
          <button type="button" class="music-play-button" data-music-toggle aria-label="播放或暂停">
            <span data-music-icon>▶</span>
          </button>
          <button type="button" data-music-next aria-label="下一首">›</button>
        </div>
        <div class="music-page-count" data-music-counter>1 / 1</div>
        <div class="music-bars" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
      </aside>

      <section class="music-side-panel" aria-label="音乐信息">
        <div class="music-panel-tabs" role="group" aria-label="切换歌词和歌单">
          <button class="is-active" type="button" data-music-panel-tab="lyrics" aria-pressed="true">歌词</button>
          <button type="button" data-music-panel-tab="playlist" aria-pressed="false">歌单</button>
        </div>

        <div class="music-panel-view" data-music-panel="lyrics">
          <div class="music-lyrics-panel" data-music-lyrics aria-label="歌词">
            <p class="music-lyrics-empty">纯音乐 无歌词</p>
          </div>
        </div>

        <div class="music-panel-view" data-music-panel="playlist" hidden>
          <label class="music-search">
            <span aria-hidden="true">⌕</span>
            <input type="search" data-music-search placeholder="搜索音轨、作者或备注..." aria-label="搜索音轨">
          </label>
          <div class="music-track-list" data-music-list aria-label="歌单列表"></div>
        </div>
      </section>
    </section>
  </main>

  <footer class="site-footer">
    <p>© 2026 Galois37.</p>
    <a href="#top">回到顶部</a>
  </footer>

  <script src="script.js?v=20260630-article-hub-1"></script>
</body>
</html>
